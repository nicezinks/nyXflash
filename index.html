<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>nyXflash</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f4f4f4;color:#222;font:14px Arial,sans-serif}
.wrap{max-width:1000px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.title{font-size:22px;font-weight:bold}
.muted,.meta,.hint,.footer{color:#666}
.pill{padding:5px 8px;border:1px solid #ccc;border-radius:6px;background:#fff}
.grid{display:grid;grid-template-columns:320px 1fr;gap:12px}
.card{background:#fff;border:1px solid #d8d8d8;border-radius:8px;padding:14px}
.sectionTitle{font-weight:bold;margin-bottom:10px}
.hero{display:grid;gap:10px}
.qr{background:#fff;border:1px solid #ddd;padding:8px;text-align:center}
.qr canvas{max-width:100%;height:auto}
.status{padding:9px;background:#f7f7f7;border:1px solid #ddd;border-radius:6px}
.url{display:flex;gap:6px}
.url input,.search{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;background:#fff}
.btn{padding:8px 10px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#222;cursor:pointer}
.btn:hover{background:#f2f2f2}
.btn.primary{background:#222;color:#fff;border-color:#222}
.actions,.toolbar{display:flex;flex-wrap:wrap;gap:6px}
.toolbar{margin-bottom:10px}
.toolbar .search{flex:1;min-width:150px}
.crumb{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.stat{padding:8px;background:#fafafa;border:1px solid #ddd;border-radius:6px}
.stat b{display:block;font-size:17px}
.list{display:grid;gap:6px;max-height:55vh;overflow:auto}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:9px;border:1px solid #ddd;border-radius:6px;background:#fff}
.name{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{display:inline-block;width:24px}
.rowactions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tiny{padding:6px 8px;font-size:12px}
.empty{padding:24px;text-align:center;color:#777;border:1px dashed #ccc;border-radius:6px}
.uploadlist{display:grid;gap:6px}
.up{padding:8px;border:1px solid #ddd;border-radius:6px}
.uphead{display:flex;justify-content:space-between;gap:8px}
.track{height:5px;margin-top:6px;background:#ddd;border-radius:5px;overflow:hidden}
.bar{height:100%;width:0;background:#333}
.footer{margin-top:12px;text-align:center;font-size:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
@media(max-width:520px){body{padding:10px}.stats{grid-template-columns:1fr 1fr}.url{flex-direction:column}.row{grid-template-columns:auto 1fr}.rowactions{grid-column:2;justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="title">nyXflash</div>
      <div class="muted">Arquivos pela rede local / Files on the local network</div>
    </div>
    <div class="pill" id="net">Conectando... / Connecting...</div>
  </div>

  <div class="grid">
    <section class="card hero">
      <div class="sectionTitle">Acesso / Access</div>
      <div class="qr"><canvas id="qr"></canvas></div>
      <div class="status" id="status">Carregando... / Loading...</div>
      <div class="url">
        <input id="url" readonly>
        <button class="btn" id="copy">Copiar / Copy</button>
      </div>
      <div class="stats">
        <div class="stat"><b id="files">0</b><span>Arquivos / Files</span></div>
        <div class="stat"><b id="folders">0</b><span>Pastas / Folders</span></div>
        <div class="stat"><b id="address">-</b><span>Wi-Fi</span></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="pick">Enviar arquivos / Upload files</button>
        <button class="btn" id="pickFolder">Enviar pasta / Upload folder</button>
      </div>
      <input id="filesInput" type="file" multiple hidden>
      <input id="folderInput" type="file" multiple webkitdirectory directory hidden>
      <div id="uploads" class="uploadlist"></div>
      <button class="btn" id="stop">Encerrar servidor / Stop server</button>
    </section>

    <section class="card">
      <div class="sectionTitle">Arquivos / Files</div>
      <div class="toolbar">
        <input class="search" id="search" placeholder="Buscar arquivos e pastas... / Search files and folders...">
        <button class="btn" id="newFolder">Nova pasta / New folder</button>
        <button class="btn" id="refresh">Atualizar / Refresh</button>
      </div>
      <div class="crumb" id="crumb"></div>
      <div class="toolbar">
        <button class="btn" id="downloadSelected">Baixar selecionados / Download selected</button>
        <button class="btn" id="deleteSelected">Excluir selecionados / Delete selected</button>
      </div>
      <div id="list" class="list"><div class="empty">Carregando... / Loading...</div></div>
    </section>
  </div>

  <div class="footer">Os arquivos ficam em storage / Files are stored locally</div>
</div>
<script>
const state={info:null,path:'',entries:[],jobs:[],active:0,index:0};
const $=id=>document.getElementById(id);
if(location.search.includes('t=')){history.replaceState(null,'',location.pathname+location.hash)}
const enc=v=>encodeURIComponent(v);
const esc=v=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>{if(n==null)return'—';if(n<1024)return`${n} B`;let u=['KB','MB','GB','TB','PB'],i=-1;do{n/=1024;i++}while(n>=1024&&i<u.length-1);return`${n.toFixed(n>=100?0:n>=10?1:2)} ${u[i]}`};
const fmtSp=n=>!n||!isFinite(n)?'0 B/s':`${fmt(n)}/s`;
async function api(path,opts={}){const r=await fetch(path,{cache:'no-store',credentials:'same-origin',...opts});const type=r.headers.get('content-type')||'';const body=type.includes('application/json')?await r.json():await r.text();if(!r.ok){const msg=typeof body==='object'&&body&&body.error?body.error:String(body);throw new Error(msg||`http_${r.status}`)}return body}
function qrEncode(text){const bytes=new TextEncoder().encode(text),version=5,size=37,cap=108;if(bytes.length>106)throw Error('url muito grande');const bits=[];const push=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};push(4,4);push(bytes.length,8);for(const b of bytes)push(b,8);push(0,4);while(bits.length%8)bits.push(0);const data=[];for(let i=0;i<bits.length;i+=8){let v=0;for(let j=0;j<8;j++)v=(v<<1)|bits[i+j];data.push(v)};let pad=true;while(data.length<cap){data.push(pad?236:17);pad=!pad}const code=data.concat(rs(data,26));const m=Array.from({length:size},()=>Array(size).fill(null));const put=(x,y,v)=>{if(x>=0&&y>=0&&x<size&&y<size)m[y][x]=!!v};const finder=(cx,cy)=>{for(let y=-1;y<=7;y++)for(let x=-1;x<=7;x++){let xx=cx+x,yy=cy+y;if(xx<0||yy<0||xx>=size||yy>=size)continue;put(xx,yy,x>=0&&x<=6&&y>=0&&y<=6&&(x===0||x===6||y===0||y===6||(x>=2&&x<=4&&y>=2&&y<=4)))}};finder(0,0);finder(size-7,0);finder(0,size-7);for(let i=8;i<size-8;i++){if(m[6][i]===null)put(i,6,i%2===0);if(m[i][6]===null)put(6,i,i%2===0)}for(let y=-2;y<=2;y++)for(let x=-2;x<=2;x++)put(30+x,30+y,Math.max(Math.abs(x),Math.abs(y))!==1);put(8,size-8,true);const f=((1<<3)<<10)|0;let v=f,p=0x537;while(v.toString(2).length-1>=10)v^=p<<((v.toString(2).length-1)-10);const format=((f|v)^0x5412)>>>0;for(let i=0;i<15;i++){const bit=((format>>>i)&1)!==0;const a=([8,i<6?i:i<8?i+1:37-15+i]);const b=([i<8?37-i-1:i<9?15-i:15-i-1,8]);put(a[0],a[1],bit);put(b[0],b[1],bit)}let idx=0,up=true;for(let x=size-1;x>=1;x-=2){let col=x;if(col<=6)col--;for(let yy=0;yy<size;yy++){const y=up?size-1-yy:yy;for(let k=0;k<2;k++){const xx=col-k;if(m[y][xx]!==null)continue;let bit=idx<code.length*8?((code[Math.floor(idx/8)]>>>(7-idx%8))&1)!==0:false;bit=bit^(((xx+y)&1)===0);put(xx,y,bit);idx++}}up=!up}return m}
const EXP=new Uint8Array(512),LOG=new Uint16Array(256);(()=>{let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11d}for(let i=255;i<512;i++)EXP[i]=EXP[i-255]})();const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;const rs=(data,count)=>{let g=[1];for(let i=0;i<count;i++){let n=Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){n[j]^=g[j];n[j+1]^=mul(g[j],EXP[i])}g=n}let rem=Array(count).fill(0);for(const b of data){let f=b^rem[0];rem.shift();rem.push(0);if(f)for(let j=0;j<count;j++)rem[j]^=mul(g[j+1],f)}return rem};
function drawQr(text){const canvas=$('qr'),m=qrEncode(text),size=m.length,scale=Math.max(4,Math.floor(320/(size+8))),quiet=4,total=(size+quiet*2)*scale;canvas.width=total;canvas.height=total;const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,total,total);ctx.fillStyle='#000';for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(m[y][x])ctx.fillRect((x+quiet)*scale,(y+quiet)*scale,scale,scale)}
async function boot(){try{state.info=await api('/api/info');updateInfo();await refresh();setInterval(async()=>{try{const next=await api('/api/info');const changed=!state.info||next.url!==state.info.url;state.info=next;updateInfo();if(changed)drawQr(next.url)}catch(_){$('net').textContent='Wi‑Fi offline / Wi‑Fi offline';$('status').textContent='Servidor indisponível / Server unavailable'}} ,2000)}catch(e){$('status').textContent='Não foi possível carregar o servidor / Could not load the server';$('net').textContent='Offline / Offline'}}
function updateInfo(){drawQr(state.info.url);$('url').value=state.info.url;$('address').textContent=state.info.lanAddress;$('files').textContent=state.info.files;$('folders').textContent=state.info.folders;$('net').textContent=`Wi‑Fi · ${state.info.lanAddress}`;$('status').textContent='Servidor ativo · mesma rede Wi‑Fi / Server active · same Wi-Fi network'}
function render(){const q=$('search').value.toLowerCase().trim();const visible=state.entries.filter(e=>!q||e.name.toLowerCase().includes(q));const parts=state.path?state.path.split('/'):[];$('crumb').innerHTML=`<button class="btn tiny" onclick="go('')">raiz</button>`+parts.map((p,i)=>`<button class="btn tiny" onclick="go(${JSON.stringify(parts.slice(0,i+1).join('/'))})">${esc(p)}</button>`).join('');if(!visible.length){$('list').innerHTML='<div class="empty">pasta vazia</div>';return}$('list').innerHTML=visible.map(e=>{const p=JSON.stringify(e.path),id=`sel_${btoa(unescape(encodeURIComponent(e.path))).replace(/[^a-z0-9]/gi,'_')}`;const icon=e.directory?'📁':'📄';return`<div class="row"><input type="checkbox" data-path="${esc(e.path)}" id="${id}"><div onclick="${e.directory?`go(${p})`:''}" style="cursor:${e.directory?'pointer':'default'}"><div class="name"><span class="icon">${icon}</span>${esc(e.name)}</div><div class="meta">${e.directory?'pasta':fmt(e.size)}</div></div><div class="rowactions">${e.directory?`<button class="btn tiny action" data-action="open" data-path="${esc(e.path)}">abrir</button><button class="btn tiny action" data-action="zip" data-path="${esc(e.path)}">zip</button>`:`<button class="btn tiny action" data-action="download" data-path="${esc(e.path)}">baixar</button>`}<button class="btn tiny action" data-action="rename" data-path="${esc(e.path)}">renomear</button><button class="btn tiny action" data-action="delete" data-path="${esc(e.path)}">excluir</button></div></div>`}).join('')}
async function refresh(){try{const data=await api(`/api/tree?path=${enc(state.path)}`);state.entries=data.entries;render()}catch(e){$('list').innerHTML='<div class="empty">não foi possível listar esta pasta</div>'}}
function go(p){state.path=p;refresh()}
function download(p){const a=document.createElement('a');a.href=`/download?path=${enc(p)}`;a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
function folderDownload(p){const a=document.createElement('a');a.href=`/download-folder?path=${enc(p)}`;a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
function watch(id){const timer=setInterval(async()=>{try{const x=await api(`/api/progress?id=${enc(id)}`);$('status').textContent=`${x.name} · ${fmt(x.bytes)} / ${fmt(x.total)} · ${fmtSp(x.speed)}`;if(x.done){clearInterval(timer);$('status').textContent=x.error?`Erro: ${x.error} / Error: ${x.error}`:`Concluído: ${x.name} / Done: ${x.name}`}}catch(_){clearInterval(timer)}},350)}
function selected(){return[...document.querySelectorAll('#list input[type=checkbox]:checked')].map(x=>x.dataset.path)}
$('list').addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button)return;e.preventDefault();e.stopPropagation();const action=button.dataset.action;const p=button.dataset.path;if(action==='open')return go(p);if(action==='zip')return folderDownload(p);if(action==='download')return download(p);if(action==='rename')return renameItem(p);if(action==='delete')return deleteItem(p)});
async function deleteItem(p){if(!confirm('Excluir permanentemente? / Permanently delete?'))return;try{await api('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p})});await refresh()}catch(e){alert(e.message)}}
async function renameItem(p){const old=p.split('/').pop();const name=prompt('Novo nome / New name:',old);if(!name||name===old)return;try{await api('/api/rename',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p,name})});await refresh()}catch(e){alert(e.message)}}
$('downloadSelected').onclick=async()=>{const all=selected();for(const p of all){try{const info=await api(`/api/tree?path=${enc(p)}`);if(info.entries)folderDownload(p);else download(p)}catch(_){download(p)}}};
$('deleteSelected').onclick=async()=>{const all=selected();if(!all.length)return;if(!confirm(`Excluir ${all.length} item(ns)? / Delete ${all.length} item(s)?`))return;for(const p of all){try{await api('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p})})}catch(_){}}await refresh()};
$('newFolder').onclick=async()=>{const name=prompt('Nome da nova pasta / New folder name:');if(!name)return;const full=state.path?`${state.path}/${name}`:name;try{await api('/api/mkdir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:full})});await refresh()}catch(e){alert(e.message)}};
$('refresh').onclick=refresh;$('search').oninput=render;$('copy').onclick=async()=>{try{if(!navigator.clipboard)throw new Error('clipboard_unavailable');await navigator.clipboard.writeText($('url').value);$('status').textContent='Link copiado / Link copied'}catch(_){alert('Nao foi possivel copiar automaticamente. / Could not copy automatically.')}};$('stop').onclick=async()=>{try{await api('/api/shutdown',{method:'POST'});$('status').textContent='Servidor encerrado / Server stopped'}catch(_){} };
$('pick').onclick=()=>$('filesInput').click();$('pickFolder').onclick=()=>$('folderInput').click();$('filesInput').onchange=e=>queue([...e.target.files].map(f=>({file:f,path:f.name})));$('folderInput').onchange=e=>queue([...e.target.files].map(f=>({file:f,path:f.webkitRelativePath||f.name})));
function queue(items){for(const item of items)state.jobs.push(item);pump()}
function pump(){while(state.active<3&&state.index<state.jobs.length){const j=state.jobs[state.index++];state.active++;upload(j).finally(()=>{state.active--;pump();refresh()})}}
function upload(job){return new Promise(resolve=>{const box=document.createElement('div');box.className='up';box.innerHTML=`<div class="uphead"><span>${esc(job.path)}</span><span class="pct">0%</span></div><div class="track"><div class="bar"></div></div>`;$('uploads').prepend(box);const xhr=new XMLHttpRequest();xhr.open('PUT',`/upload?path=${enc(job.path.replace(/\\/g,'/'))}`);xhr.upload.onprogress=e=>{if(e.lengthComputable){const pct=Math.round(e.loaded/e.total*100);box.querySelector('.pct').textContent=`${pct}% · ${fmt(e.loaded)}/${fmt(e.total)}`;box.querySelector('.bar').style.width=pct+'%'}};xhr.onload=()=>{box.querySelector('.pct').textContent=xhr.status>=200&&xhr.status<300?'Concluído / Done':`Erro ${xhr.status} / Error ${xhr.status}`;if(xhr.status>=200&&xhr.status<300)box.querySelector('.bar').style.width='100%';resolve()};xhr.onerror=()=>{box.querySelector('.pct').textContent='Erro de conexão / Connection error';resolve()};xhr.send(job.file)})}
const drop=document.body;['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();$('drop')?.classList.add('drag')}));document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',async e=>{e.preventDefault();const items=[...e.dataTransfer.items];const out=[];for(const item of items){const entry=item.webkitGetAsEntry?.();if(entry)await walk(entry,'',out);else{const file=item.getAsFile();if(file)out.push({file,path:file.name})}}if(out.length)queue(out)});
async function walk(entry,prefix,out){if(entry.isFile)return new Promise(r=>entry.file(f=>{out.push({file:f,path:prefix+f.name});r()}));if(entry.isDirectory){const reader=entry.createReader();const all=[];while(true){const batch=await new Promise(r=>reader.readEntries(r));if(!batch.length)break;all.push(...batch)}for(const child of all)await walk(child,prefix+entry.name+'/',out)}}
boot();
</script>
</body>
</html>
