<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nyXflash</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101214;
            color: #e9edf1;
            font: 14px Arial, Helvetica, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .top {
            height: 58px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #262a2f;
            background: #14171a;
        }

        .logo {
            margin-right: auto;
            font-size: 18px;
            font-weight: 700;
        }

        .wrap {
            width: min(980px, 100%);
            margin: 0 auto;
            padding: 18px;
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 11px;
            border: 1px solid #30353b;
            border-radius: 6px;
            background: #1b1f23;
            color: #e9edf1;
        }

        .btn:hover {
            background: #24292e;
        }

        .btn.main {
            border-color: #e9edf1;
            background: #e9edf1;
            color: #111;
        }

        .btn.danger {
            color: #ffb6b6;
        }

        .small {
            padding: 6px 8px;
        }

        .search {
            width: 220px;
            margin-left: auto;
            padding: 8px 10px;
            border: 1px solid #30353b;
            border-radius: 6px;
            outline: none;
            background: #171a1e;
            color: #fff;
        }

        .path {
            min-height: 38px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            overflow: auto;
        }

        .path button {
            padding: 3px 0;
            border: 0;
            background: transparent;
            color: #9cbcff;
            white-space: nowrap;
        }

        .card {
            overflow: hidden;
            border: 1px solid #262a2f;
            border-radius: 8px;
            background: #14171a;
        }

        .row {
            min-height: 54px;
            padding: 8px 12px;
            display: grid;
            grid-template-columns: 34px minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #24282d;
        }

        .row:last-child {
            border-bottom: 0;
        }

        .name {
            overflow: hidden;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .meta {
            margin-top: 3px;
            color: #8b929a;
            font-size: 12px;
        }

        .open-item {
            min-width: 0;
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            text-align: left;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .check {
            width: 16px;
            height: 16px;
        }

        .empty {
            padding: 42px 18px;
            color: #777f88;
            text-align: center;
        }

        .upload {
            margin-top: 14px;
            padding: 18px;
            border: 1px dashed #3a4047;
            border-radius: 8px;
            color: #929aa3;
            text-align: center;
        }

        .upload.drag {
            background: #1a1e22;
        }

        .jobs {
            display: grid;
            gap: 6px;
            margin-top: 10px;
        }

        .job {
            padding: 8px 10px;
            border: 1px solid #292e34;
            border-radius: 6px;
            background: #14171a;
        }

        .jobtop {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .track {
            height: 4px;
            margin-top: 7px;
            overflow: hidden;
            border-radius: 999px;
            background: #2a2f35;
        }

        .fill {
            width: 0;
            height: 100%;
            background: #e9edf1;
        }

        .status {
            min-height: 18px;
            margin-top: 10px;
            color: #8f969e;
        }

        .info {
            display: flex;
            gap: 14px;
            margin-bottom: 12px;
            color: #858d96;
            font-size: 12px;
            flex-wrap: wrap;
        }

        @media (max-width: 700px) {
            .top {
                padding: 0 12px;
            }

            .wrap {
                padding: 12px;
            }

            .row {
                grid-template-columns: 28px minmax(0, 1fr);
            }

            .actions {
                grid-column: 2;
                flex-wrap: wrap;
            }

            .search {
                width: 100%;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <header class="top">
        <div class="logo">nyXflash</div>
        <button class="btn small" id="refresh">atualizar</button>
    </header>

    <main class="wrap">
        <div class="bar">
            <button class="btn main" id="filesBtn">enviar arquivos</button>
            <button class="btn" id="folderBtn">enviar pasta</button>
            <button class="btn" id="newFolder">nova pasta</button>
            <button class="btn" id="downloadSelected">baixar selecionados</button>
            <button class="btn danger" id="deleteSelected">excluir selecionados</button>
            <input class="search" id="search" placeholder="procurar">
        </div>

        <div class="info">
            <span id="access">localhost</span>
            <span id="count"></span>
            <span>7 arquivos por envio</span>
        </div>

        <div class="path" id="path"></div>
        <div class="card" id="list"></div>
        <div class="upload" id="drop">arraste arquivos aqui ou use os botoes acima</div>
        <div class="jobs" id="jobs"></div>
        <div class="status" id="status"></div>

        <input id="files" type="file" multiple hidden>
        <input id="folder" type="file" webkitdirectory multiple hidden>
    </main>

    <script>
        const state = {
            path: '',
            entries: [],
            jobs: [],
            nextJob: 0,
            activeJobs: 0,
            batch: ''
        };

        const byId = id => document.getElementById(id);

        function encode(value) {
            return encodeURIComponent(value);
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function formatSize(value) {
            if (value === null || value === undefined) return '';
            if (value < 1024) return `${value} B`;

            const units = ['KB', 'MB', 'GB', 'TB'];
            let size = value;
            let unit = -1;

            do {
                size /= 1024;
                unit += 1;
            } while (size >= 1024 && unit < units.length - 1);

            return `${size.toFixed(size >= 10 ? 0 : 1)} ${units[unit]}`;
        }

        async function request(url, options = {}) {
            const headers = {
                ...(options.headers || {}),
                'X-NYXFLASH-CLIENT': 'nyxflash-web'
            };

            const response = await fetch(url, {
                ...options,
                headers
            });

            if (!response.ok) {
                let message = `erro ${response.status}`;
                try {
                    const data = await response.json();
                    message = data.message || data.error || message;
                } catch (_) {}
                throw new Error(message);
            }

            return response.json();
        }

        function newBatch() {
            return crypto.randomUUID().replaceAll('-', '');
        }

        function selectedEntries() {
            const indexes = [...document.querySelectorAll('#list .check:checked')]
                .map(input => Number(input.dataset.index));

            return indexes
                .map(index => state.entries[index])
                .filter(Boolean);
        }

        function openItem(item) {
            if (item.directory) {
                state.path = item.path;
                load();
            }
        }

        function renderPath() {
            const parts = state.path ? state.path.split('/') : [];
            let html = '<button type="button" data-path="">raiz</button>';

            parts.forEach((part, index) => {
                const full = parts.slice(0, index + 1).join('/');
                html += `<span>/</span><button type="button" data-path="${escapeHtml(full)}">${escapeHtml(part)}</button>`;
            });

            byId('path').innerHTML = html;
        }

        function render() {
            const query = byId('search').value.trim().toLowerCase();
            const rows = state.entries
                .map((item, index) => ({ item, index }))
                .filter(({ item }) => !query || item.name.toLowerCase().includes(query));

            renderPath();

            if (!rows.length) {
                byId('list').innerHTML = '<div class="empty">pasta vazia</div>';
                byId('count').textContent = '0 itens';
                return;
            }

            byId('list').innerHTML = rows.map(({ item, index }) => {
                const icon = item.directory ? '📁' : '📄';
                const info = item.directory ? 'pasta' : formatSize(item.size);
                const action = item.directory ? 'zip' : 'baixar';

                return `
                    <div class="row" data-index="${index}">
                        <input class="check" type="checkbox" data-index="${index}">
                        <button type="button" class="open-item" data-index="${index}">
                            <div class="name">${icon} ${escapeHtml(item.name)}</div>
                            <div class="meta">${info}</div>
                        </button>
                        <div class="actions">
                            <button type="button" class="btn small download-item" data-index="${index}">${action}</button>
                            <button type="button" class="btn small rename-item" data-index="${index}">renomear</button>
                            <button type="button" class="btn small danger delete-item" data-index="${index}">excluir</button>
                        </div>
                    </div>`;
            }).join('');

            byId('count').textContent = `${rows.length} itens`;
        }

        async function load() {
            try {
                const data = await request(`/api/tree?path=${encode(state.path)}`);
                state.entries = data.entries;
                render();
                byId('status').textContent = '';
            } catch (error) {
                byId('list').innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
                byId('status').textContent = error.message;
            }
        }

        function addJob(job) {
            const box = document.createElement('div');
            box.className = 'job';
            box.innerHTML = `
                <div class="jobtop">
                    <span>${escapeHtml(job.path)}</span>
                    <span class="pct">0%</span>
                </div>
                <div class="track"><div class="fill"></div></div>`;
            byId('jobs').prepend(box);
            return box;
        }

        function sendFile(job) {
            return new Promise(resolve => {
                const box = addJob(job);
                const xhr = new XMLHttpRequest();

                xhr.open('PUT', `/upload?path=${encode(job.path.replaceAll('\\', '/'))}`);
                xhr.setRequestHeader('X-NYXFLASH-BATCH', state.batch);
                xhr.setRequestHeader('X-NYXFLASH-CLIENT', 'nyxflash-web');

                xhr.upload.onprogress = event => {
                    if (!event.lengthComputable) return;
                    const percent = Math.round((event.loaded / event.total) * 100);
                    box.querySelector('.pct').textContent = `${percent}%`;
                    box.querySelector('.fill').style.width = `${percent}%`;
                };

                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        box.querySelector('.pct').textContent = 'ok';
                        box.querySelector('.fill').style.width = '100%';
                    } else {
                        let message = `erro ${xhr.status}`;
                        try {
                            const data = JSON.parse(xhr.responseText);
                            message = data.message || data.error || message;
                        } catch (_) {}
                        box.querySelector('.pct').textContent = message;
                    }
                    resolve();
                };

                xhr.onerror = () => {
                    box.querySelector('.pct').textContent = 'erro de conexao';
                    resolve();
                };

                xhr.send(job.file);
            });
        }

        function pump() {
            while (state.activeJobs < 2 && state.nextJob < state.jobs.length) {
                const job = state.jobs[state.nextJob];
                state.nextJob += 1;
                state.activeJobs += 1;

                sendFile(job).finally(() => {
                    state.activeJobs -= 1;
                    load();
                    pump();
                });
            }
        }

        function queueUpload(items) {
            if (!items.length) return;

            if (state.activeJobs || state.nextJob < state.jobs.length) {
                alert('aguarde o envio atual terminar.');
                return;
            }

            if (items.length > 7) {
                alert('envie no maximo 7 arquivos por vez.');
                return;
            }

            state.jobs = items;
            state.nextJob = 0;
            state.batch = newBatch();
            pump();
        }

        function download(item) {
            const route = item.directory ? '/download-folder' : '/download';
            window.location.href = `${route}?path=${encode(item.path)}`;
        }

        async function rename(item) {
            const currentName = item.name;
            const newName = prompt('novo nome:', currentName);
            if (!newName || newName === currentName) return;

            try {
                await request('/api/rename', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        path: item.path,
                        name: newName
                    })
                });
                await load();
            } catch (error) {
                alert(error.message);
            }
        }

        async function remove(item) {
            if (!confirm(`excluir "${item.name}"?`)) return;

            try {
                await request('/api/delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ path: item.path })
                });
                await load();
            } catch (error) {
                alert(error.message);
            }
        }

        async function createFolder() {
            const name = prompt('nome da pasta:');
            if (!name) return;

            const folder = state.path ? `${state.path}/${name}` : name;

            try {
                await request('/api/mkdir', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ path: folder })
                });
                await load();
            } catch (error) {
                alert(error.message);
            }
        }

        async function deleteSelected() {
            const items = selectedEntries();
            if (!items.length) return;
            if (!confirm(`excluir ${items.length} item(ns)?`)) return;

            for (const item of items) {
                try {
                    await request('/api/delete', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ path: item.path })
                    });
                } catch (error) {
                    alert(error.message);
                    break;
                }
            }

            await load();
        }

        function downloadSelected() {
            const items = selectedEntries();
            for (const item of items) download(item);
        }

        byId('list').addEventListener('click', event => {
            const button = event.target.closest('button');
            if (!button) return;

            if (button.dataset.path !== undefined) {
                state.path = button.dataset.path;
                load();
                return;
            }

            const index = Number(button.dataset.index);
            if (!Number.isInteger(index) || !state.entries[index]) return;

            const item = state.entries[index];

            if (button.classList.contains('open-item')) {
                openItem(item);
            } else if (button.classList.contains('download-item')) {
                download(item);
            } else if (button.classList.contains('rename-item')) {
                rename(item);
            } else if (button.classList.contains('delete-item')) {
                remove(item);
            }
        });

        byId('filesBtn').addEventListener('click', () => byId('files').click());
        byId('folderBtn').addEventListener('click', () => byId('folder').click());
        byId('newFolder').addEventListener('click', createFolder);
        byId('downloadSelected').addEventListener('click', downloadSelected);
        byId('deleteSelected').addEventListener('click', deleteSelected);
        byId('refresh').addEventListener('click', load);
        byId('search').addEventListener('input', render);

        byId('files').addEventListener('change', event => {
            queueUpload([...event.target.files].map(file => ({
                file,
                path: file.name
            })));
            event.target.value = '';
        });

        byId('folder').addEventListener('change', event => {
            queueUpload([...event.target.files].map(file => ({
                file,
                path: file.webkitRelativePath || file.name
            })));
            event.target.value = '';
        });

        for (const type of ['dragenter', 'dragover']) {
            byId('drop').addEventListener(type, event => {
                event.preventDefault();
                byId('drop').classList.add('drag');
            });
        }

        byId('drop').addEventListener('dragleave', () => {
            byId('drop').classList.remove('drag');
        });

        byId('drop').addEventListener('drop', event => {
            event.preventDefault();
            byId('drop').classList.remove('drag');

            queueUpload([...event.dataTransfer.files].map(file => ({
                file,
                path: file.name
            })));
        });

        async function loadInfo() {
            try {
                const info = await request('/api/info');
                byId('access').textContent = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
                    ? 'localhost'
                    : location.hostname;
                byId('count').textContent = `${info.files} arquivos / ${info.folders} pastas`;
            } catch (_) {}
        }

        load();
        loadInfo();
    </script>
</body>
</html>
